<script>

/* =====================================================
   提取码系统
===================================================== */

let accessCode = "";
let sessionId = "";

/*
   每次打开网页生成一个新的 session ID
*/
sessionId =
    Date.now().toString() +
    "-" +
    Math.random().toString(36).substring(2);


/* =====================================================
   提取码页面
===================================================== */

function showCodePage() {

    document.getElementById("app").innerHTML = `

        <div class="eyebrow">
            ACCESS CODE
        </div>

        <h1>
            请输入提取码
        </h1>

        <div class="divider"></div>

        <p class="subtitle">
            请输入你的专属提取码后开始测试。
        </p>

        <input
            id="codeInput"
            class="code-input"
            type="text"
            placeholder="请输入提取码"
            autocomplete="off"
        >

        <div
            id="errorMessage"
            class="error-message">
        </div>

        <button
            class="start-btn"
            onclick="verifyCode()">

            开始测试

        </button>

        <div
            id="loading"
            class="loading">
        </div>

    `;

    /*
       允许直接按 Enter
    */
    document
        .getElementById("codeInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                verifyCode();
            }

        });
}


/* =====================================================
   验证提取码
===================================================== */

async function verifyCode() {

    const input =
        document.getElementById("codeInput");

    const error =
        document.getElementById("errorMessage");

    const loading =
        document.getElementById("loading");

    const code =
        input.value.trim();

    error.textContent = "";

    if (!code) {

        error.textContent =
            "请输入提取码";

        return;
    }

    loading.textContent =
        "正在验证……";

    try {

        const response =
            await fetch("/api/verify-code", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    code: code,

                    sessionId: sessionId

                })

            });


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            error.textContent =
                data.message || "提取码验证失败";

            loading.textContent = "";

            return;
        }


        /*
           保存当前有效提取码
        */

        accessCode = code;

        loading.textContent = "";

        startTest();


    } catch (error) {

        console.error(error);

        loading.textContent = "";

        document
            .getElementById("errorMessage")
            .textContent =
            "网络连接失败，请稍后再试";

    }

}


/* =====================================================

===================================================== */

const questions = [

/* =====================================================
   六个时代
===================================================== */

const eras = [
    "唐朝",
    "宋朝",
    "汉朝",
    "明朝",
    "魏晋",
    "春秋战国"
];


/* =====================================================
   结果说明
===================================================== */

const descriptions = {

    "唐朝":
    "你更适合开放、多元、充满交流与新鲜事物的环境。你可能享受繁华城市、跨地域交流和不断变化的生活。",

    "宋朝":

    "汉朝":

    "魏晋":

    "春秋战国":
    "你能够适应竞争和变化，面对不确定性时也愿意寻找机会。你可能在思想碰撞和快速变化的时代更容易发挥。"

};


/* =====================================================
   关键词
===================================================== */

const keywords = {

    "唐朝": ["开放多元", "探索新鲜事物", "社交"],

    "宋朝": ["商业文化", "生活品质", "求知"],

    "汉朝": ["稳定秩序", "长期积累", "责任"],

    "明朝": ["务实发展", "执行力", "稳定"],

    "魏晋": ["自由独立", "思想", "个性"],

    "春秋战国": ["竞争变化", "冒险", "机会"]

};


/* =====================================================
   评分
===================================================== */

const weights = [

[
[3,2,1,1,2,2],
[3,3,1,2,1,2],
[1,2,3,3,0,0],
[2,1,0,1,3,2]
],

],

],

],

[2,3,1,1,3,1],

],

],

[

],

[

[3,3,1,2,1,3],
[1,2,2,2,2,1],
[2,1,0,0,3,1]
],

[

],

[3,3,1,2,1,3],

];


/* =====================================================
   当前状态
===================================================== */

let currentQuestion = 0;

let scores = [0,0,0,0,0,0];


/* =====================================================
   开始测试
===================================================== */

function startTest() {

    currentQuestion = 0;

    scores = [0,0,0,0,0,0];

    showQuestion();

}


/* =====================================================
   显示题目
===================================================== */

function showQuestion() {

    const q =
        questions[currentQuestion];

    const progress =
        (currentQuestion / questions.length) * 100;

    let html = `

        <div class="question-number">
            QUESTION ${currentQuestion + 1} / ${questions.length}
        </div>

        <div class="progress-container">

            <div
                class="progress-bar"
                style="width:${progress}%">
            </div>

        </div>

        <div class="question">
            ${q.question}
        </div>

    `;


    q.options.forEach((option,index) => {

        html += `

            <button
                class="option"
                onclick="selectAnswer(${index})">

                <strong>
                    ${["A","B","C","D"][index]}.
                </strong>

                ${option}

            </button>

        `;

    });


    document.getElementById("app").innerHTML =
        html;

}


/* =====================================================
   选择答案
===================================================== */

function selectAnswer(optionIndex) {

    const currentWeights =
        weights[currentQuestion][optionIndex];


    for(let i = 0; i < 6; i++) {

        scores[i] += currentWeights[i];

    }


    currentQuestion++;


    if(currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}


/* =====================================================
   完成测试
===================================================== */

async function finishTest() {

    try {

        const response =
            await fetch("/api/finish-test", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    code: accessCode,

                    sessionId: sessionId

                })

            });


        const data =
            await response.json();


        if(!response.ok || !data.success) {

            console.error(
                "提取码失效请求失败:",
                data
            );

            return false;

        }


        return true;


    } catch(error) {

        console.error(
            "finish-test error:",
            error
        );

        return false;

    }

}


/* =====================================================
   显示结果
===================================================== */

async function showResult() {

    /*
       测试完成。
       先让服务器将提取码标记为已使用。
    */

    await finishTest();


    const ranking = scores
        .map((score,index) => ({

            score: score,
            index: index

        }))
        .sort((a,b) =>
            b.score - a.score
        );


    const winner =
        ranking[0];


    const second =
        ranking[1];


    let match =
        78 +
        Math.round(
            (winner.score -
             second.score) * 2
        );


    if(match > 96)
        match = 96;


    if(match < 75)
        match = 75;


    const era =
        eras[winner.index];


    let html = `

        <div class="result-page">

            <div class="result-small">
                YOUR ERA
            </div>

            <div class="result-era">
                ${era}

                    .join("")

                你的时代匹配度
            </div>

                 winner.score) * 100
            );

                    </span>

                    <div

                        style="width:${percentage}%">
                    </div>

                </div>

            </div>

        `;

    });


    html += `

                本测试通过生活方式、风险偏好、
                社交倾向、规则偏好、求知欲与价值取向等维度，

            </div>

            <button
                class="restart-btn"
                onclick="showCodePage()">

                重新测试

            </button>

        </div>

    `;


    document.getElementById("app").innerHTML =

}
